<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container text-center mt-5">
    <h1 class="display-4">Oops! Something Went Wrong</h1>
    <div th:if="${errorCode}" class="mb-3">
        <span class="badge bg-danger" th:text="${errorCode}">
            ERROR_CODE
        </span>
    </div>
    <p class="lead" th:text="${message} ?: 'We are sorry, but an unexpected error has occurred. Please try again later.'">        We're sorry, but an unexpected error has occurred. Please try again later.
    </p>
    <a class="btn btn-primary" href="/index">Go to Home</a>
</div>

</body>
</html>
