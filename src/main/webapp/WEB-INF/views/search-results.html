<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/index">
            <img src="images/weather-app.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">zhukovsd</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">Sign out</button>
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form th:action="@{/search-results}" method="post" class="d-flex my-4">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control"
                       type="text"
                       name="name"
                       placeholder="Enter location"
                       required>
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </div>
            <button type="submit" class="btn btn-outline-success">Search</button>
        </form>
        <!-- ^^^-->
        <div th:if="${locations != null}">
            <h2 th:if="${!locations.isEmpty()}">
                Found <span th:text="${locations.size()}"></span> locations for
                "<span th:text="${searchQuery}"></span>":
            </h2>

            <h2 th:if="${locations.isEmpty()}">
                No locations found for "<span th:text="${searchQuery}"></span>"
            </h2>

            <div class="row" th:if="${!locations.isEmpty()}">
                <div th:each="location : ${locations}"
                     class="col-12 col-lg-3 col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${location.name}"></h5>
                            <p class="card-text mb-1">Latitude: <span th:text="${location.latitude}"></span></p>
                            <p class="card-text mb-1">Longitude: <span th:text="${location.longitude}"></span></p>
                            <p class="card-text mb-1">Country: <span th:text="${location.country}"></span></p>
                            <div class="mt-auto">
                                <!-- Кнопка выбора этой локации -->
                                <form th:action="@{/select-location}" method="post" style="margin: 0;">
                                    <input type="hidden" name="lat" th:value="${location.latitude}">
                                    <input type="hidden" name="lon" th:value="${location.longitude}">
                                    <input type="hidden" name="city" th:value="${location.name}">
                                    <button type="submit" class="btn btn-primary w-100">Select</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
