<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/index">
            <img src="images/weather-app.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
             <span class="navbar-text me-3"
                   th:text="${userName}">zhukovsd</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">Sign out</button>
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form th:action="@{/search-results}" method="post" class="d-flex my-4">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control"
                       type="text"
                       name="name"
                       placeholder="Enter location"
                       required>
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </div>
            <button type="submit" class="btn btn-outline-success">Search</button>
        </form>

        <div>
            <div th:if="${not #lists.isEmpty(weatherList)}">
                <div class="row">
                    <div th:each="weather : ${weatherList}" class="col-12 col-lg-3 col-md-6 mb-4">
                        <div class="card h-100 position-relative weather-card">
                            <!-- Опционально: форма удаления -->
                            <div class="position-absolute weather-card-delete-form">
                                <form th:action="@{/delete-location(city=${weather.city}, country=${weather.country})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn-close" aria-label="Delete"></button>
                                </form>
                            </div>

                            <!-- Динамическая иконка -->
                            <img class="card-img-top img-fluid"
                                 th:src="'https://openweathermap.org/img/wn/' + ${weather.icon} + '@4x.png'"
                                 th:alt="${weather.description} + ' icon'">

                            <div class="card-body d-flex flex-column">
                                <!-- Все данные динамические -->
                                <h1 class="card-text"
                                    th:text="${#numbers.formatDecimal(weather.temperature, 0, 0)} + '°C'"></h1>
                                <h3 class="card-title"
                                    th:text="${weather.city} + ', ' + ${weather.country}"></h3>
                                <p class="card-text mb-1">
                                    Feels like <span
                                        th:text="${#numbers.formatDecimal(weather.feelsLike, 0, 0)}"></span>°C.
                                    <span th:text="${weather.description}"></span>
                                </p>
                                <p class="card-text mb-1"
                                   th:text="'Humidity: ' + ${weather.humidity} + '%'"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(weatherList)}" class="text-center py-5">
                <h4 class="text-muted">No weather data available</h4>
                <p class="text-muted">Search for a city to see weather information</p>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
